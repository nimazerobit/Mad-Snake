name: Build and Release APK

on:
  push:
    tags:
      - "v*"
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v1.0.0)"
        required: false
        default: ""
        type: string
      draft:
        description: "Create draft release"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Create prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Determine version tag
        id: vars
        run: |
          git fetch --tags --force

          TARGET_COMMIT="${{ github.event.pull_request.head.sha }}"
          if [ -z "$TARGET_COMMIT" ]; then
            TARGET_COMMIT="HEAD"
          fi

          CURRENT_TAG=$(git tag --points-at "$TARGET_COMMIT" | grep '^v' | head -n 1)
          if [ -z "$CURRENT_TAG" ]; then
            CURRENT_TAG=$(git tag --points-at "$TARGET_COMMIT" | head -n 1)
          fi

          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
            SHOULD_RELEASE="true"
          elif [ "${{ inputs.draft }}" = "true" ] || [ "${{ inputs.prerelease }}" = "true" ]; then
            TAG="v1.0.${{ github.run_number }}"
            SHOULD_RELEASE="true"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            SHOULD_RELEASE="true"
          elif [ -n "$CURRENT_TAG" ]; then
            TAG="$CURRENT_TAG"
            SHOULD_RELEASE="true"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            TAG="pr-${{ github.event.pull_request.number }}-${{ github.run_number }}"
            SHOULD_RELEASE="false"
          else
            TAG="v1.0.${{ github.run_number }}"
            SHOULD_RELEASE="false"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "should_release=${SHOULD_RELEASE}" >> "$GITHUB_OUTPUT"

      - name: Prepare APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find app -name "*-debug.apk" | head -n 1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK found after build!"
            exit 1
          fi
          echo "Found APK at $APK_PATH"
          cp "$APK_PATH" "MadSnake-${{ steps.vars.outputs.tag }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MadSnake-${{ steps.vars.outputs.tag }}
          path: MadSnake-${{ steps.vars.outputs.tag }}.apk

      - name: Create GitHub Release
        if: steps.vars.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Release ${{ steps.vars.outputs.tag }}
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          target_commitish: ${{ github.sha }}
          files: MadSnake-${{ steps.vars.outputs.tag }}.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
